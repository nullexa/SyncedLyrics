<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blyrics preview</title>
    <style>
      body {
        font-family: Courier New;
        width: 360px;
        padding: 10px;
        background-color: #121318;
        color: #e2e3e8;
      }
      #status {
        font-size: 12px;
        color: #8f8f8f;
        margin-bottom: 6px;
      }
      pre#preview {
        font-family: Courier New;
        white-space: pre-wrap;
        word-wrap: break-word;
        max-height: 200px;
        overflow: auto;
        /* background: #f7f7f7; */
        border-radius: 6px;
        padding: 8px;
        font-family: monospace;
        font-size: 11px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 6px;
        background-color: #183578;
        color: #e2e3e8;
        margin: 4px 2px;
        text-decoration: none;
        border: none;
        font-size: 15px;
        text-align: center;
        outline: none;
      }
      #copyBtn {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <pre id="preview">—</pre>
    <div class="row">
      <button id="refreshBtn">Refresh</button>
      <button id="copyBtn">Copy</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
